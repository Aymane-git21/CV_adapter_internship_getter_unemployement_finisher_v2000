# Local dev latexc. The container persisting until `docker compose down` IS
# the local warm-session semantics: caches live as long as the container.
#   up:    docker compose -f services/latexc/compose.yml up -d --build
#   tests: docker compose -f services/latexc/compose.yml exec latexc python -m pytest /srv/latexc/tests -q
#   off:   docker compose -f services/latexc/compose.yml down
services:
  latexc:
    build:
      context: ../..
      dockerfile: services/latexc/Dockerfile
    ports:
      - "8021:8080"
    environment:
      LATEXC_TOKEN: dev-token
